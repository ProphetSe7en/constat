version: 2

updates:
  # Go modules, grouped into one weekly PR. The cooldown keeps a freshly
  # published (possibly compromised) release out until it has been public
  # for a week.
  - package-ecosystem: gomod
    directory: /ui
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      go-modules:
        patterns:
          - "*"
    labels:
      - dependencies
      - go
    commit-message:
      prefix: deps
      include: scope

  # GitHub Actions are pinned by commit SHA; Dependabot refreshes the SHA and
  # version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope

  # Go builder and Alpine runtime images. Reviewed by hand.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: deps(docker)
      include: scope
